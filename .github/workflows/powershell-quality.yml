name: PowerShell quality

on:
  pull_request:
    paths:
      - '**/*.ps1'
      - '.github/workflows/powershell-quality.yml'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - '**/*.ps1'
      - '.github/workflows/powershell-quality.yml'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
      - name: Check syntax, help and analyzer errors
        shell: pwsh
        run: ./.github/scripts/Test-PowerShellQuality.ps1
